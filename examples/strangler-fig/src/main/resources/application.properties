spring.application.name=strangler-fig-example

# H2 in-memory database for demo purposes
spring.datasource.url=jdbc:h2:mem:stranglerfig;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Strangler Fig feature flag
# Set to true to route /api/orders to the new hexagonal service
# Set to false (default) to keep routing to the legacy controller
feature.new-order-service.enabled=false
