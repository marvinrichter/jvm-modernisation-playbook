spring.application.name=branch-by-abstraction-example

spring.datasource.url=jdbc:h2:mem:bba;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true

# Branch-by-Abstraction feature flag
# false (default) = legacy LegacyOrderAdapter handles requests
# true            = new JpaOrderAdapter handles requests
feature.new-order-service=false
