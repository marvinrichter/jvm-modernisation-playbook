site_name: JVM Modernisierungs-Playbook
site_url: https://marvinrichter.github.io/jvm-modernisation-playbook
site_description: >-
  Muster für die Migration von Legacy-JVM-Monolithen zu moderner Spring-Boot-Architektur —
  mit echtem Code, nicht nur mit Diagrammen.
site_author: Marvin Richter

repo_url: https://github.com/marvinrichter/jvm-modernisation-playbook
repo_name: marvinrichter/jvm-modernisation-playbook
edit_uri: edit/main/docs/

theme:
  name: material
  language: de
  palette:
    - scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Zu Dunkel-Modus wechseln
    - scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Zu Hell-Modus wechseln
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.annotate
    - content.code.copy
    - content.tabs.link

plugins:
  - search:
      lang:
        - de
        - en
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: de
          default: true
          name: Deutsch
          build: true
          site_name: JVM Modernisierungs-Playbook
          site_description: >-
            Muster für die Migration von Legacy-JVM-Monolithen zu moderner Spring-Boot-Architektur —
            mit echtem Code, nicht nur mit Diagrammen.
          nav_translations:
            Home: Startseite
            Getting Started: Schnellstart
            Patterns: Muster
            Overview: Übersicht
            Code Patterns: Code-Muster
            About: Über das Playbook
        - locale: en
          name: English
          build: true
          site_name: JVM Modernisation Playbook
          site_description: >-
            Patterns for migrating legacy JVM monoliths to modern Spring Boot architecture —
            with real code, not diagrams.

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Patterns:
    - Overview: patterns/index.md
    - Strangler Fig: patterns/strangler-fig.md
    - Branch-by-Abstraction: patterns/branch-by-abstraction.md
    - Anti-Corruption Layer: patterns/anti-corruption-layer.md
    - Code Patterns: patterns/code-patterns.md
  - About: about.md

extra:
  alternate:
    - name: Deutsch
      link: /jvm-modernisation-playbook/
      lang: de
    - name: English
      link: /jvm-modernisation-playbook/en/
      lang: en
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/marvinrichter
    - icon: fontawesome/solid/globe
      link: https://marvin-richter.de

copyright: >
  Copyright &copy; 2026 Marvin Richter &mdash;
  <a href="https://marvin-richter.de">marvin-richter.de</a>
